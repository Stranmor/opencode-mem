name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and source
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "opencode-mem-cli") | .version')"
          test "v${version}" = "${GITHUB_REF_NAME}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

  build-release:
    needs: verify-source
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Setup Rust caching
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cross
        if: matrix.use_cross == true
        uses: taiki-e/install-action@2793c337589f216c26806998c34d2c7ed863f875 # cross

      - name: Build binary (cargo)
        if: matrix.use_cross == false
        run: cargo build --release -p opencode-mem-cli --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: matrix.use_cross == true
        run: cross build --release -p opencode-mem-cli --target ${{ matrix.target }}

      - name: Prepare artifact and calculate checksum
        run: |
          BIN_NAME="opencode-mem-${{ matrix.target }}"

          cp "target/${{ matrix.target }}/release/opencode-mem" "$BIN_NAME"
          sha256sum "$BIN_NAME" > "$BIN_NAME.sha256"
          echo "ARTIFACT_NAME=$BIN_NAME" >> "$GITHUB_ENV"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT_NAME }}
            ${{ env.ARTIFACT_NAME }}.sha256
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "opencode-mem ${GITHUB_REF_NAME}"
